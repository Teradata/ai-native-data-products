name: validate

# Required check for merging to main (see design/core/IMPLEMENTATION_AUTHORING.md
# section 8). Runs every repository validation suite: design and specification
# lint, template hygiene (Jinja only), template rendering for every binding,
# and native engine tests for DuckDB and PostgreSQL.
#
# A skipped test is a gap, not a pass (standard section 8). The suites are run
# with engines available, and the job fails if any test reports a skip.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_TEST_DSN: postgresql://postgres:ci-only-disposable@localhost:5432/ci

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r tooling/bindings/requirements.txt duckdb "psycopg[binary]"

      - name: Validation suite (design lint, template hygiene, rendering)
        run: python -m unittest discover -s tooling/validation/tests -v 2>&1 | tee validation.log

      - name: Binding suite (DuckDB and PostgreSQL engine tests)
        run: python -m unittest discover -s tooling/bindings/tests -v 2>&1 | tee bindings.log

      - name: Fail on skipped tests
        run: |
          if grep -E "skipped|\.\.\. skipped" validation.log bindings.log; then
            echo "A skipped test is a conformance gap, not a pass." >&2
            exit 1
          fi
