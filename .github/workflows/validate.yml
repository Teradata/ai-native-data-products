name: validate

# Required check for merging to main (see design/core/IMPLEMENTATION_AUTHORING.md
# section 8). Runs every repository validation suite: design and specification
# lint, template hygiene (Jinja only), template rendering for every binding,
# and native engine tests for DuckDB, PostgreSQL and Teradata.
#
# Teradata has no container image, so its engine tests run against a disposable
# system named by the TERADATA_TEST_DSN repository secret (teradatasql connection
# parameters as JSON). Until the secret is set those tests skip, and the job
# fails: missing engine coverage is a gap, never a pass. The tests own every
# database and role prefixed `anptest_` on that system, so runs that use it are
# serialised across branches.
#
# A skipped test is a gap, not a pass (standard section 8). The suites are run
# with engines available, and the job fails if any test reports a skip.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: teradata-engine
      cancel-in-progress: false

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-disposable
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_TEST_DSN: postgresql://postgres:ci-only-disposable@localhost:5432/ci
      TERADATA_TEST_DSN: ${{ secrets.TERADATA_TEST_DSN }}

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r tooling/bindings/requirements.txt duckdb pytz "psycopg[binary]" teradatasql

      - name: Validation suite (design lint, template hygiene, rendering)
        run: python -m unittest discover -s tooling/validation/tests -v 2>&1 | tee validation.log

      # Runs the binding and package tests once and regenerates each binding's
      # CONFORMANCE.md from them. Fails on any failing or skipped test, and when a
      # committed report differs from the regenerated one (Authoring Standard 8.1);
      # the regenerated reports are uploaded, to be committed when they change.
      - name: Binding suite and conformance reports (DuckDB, PostgreSQL and Teradata engine tests)
        run: python tooling/bindings/conformance.py --check --output build/conformance 2>&1 | tee bindings.log

      - name: Upload the regenerated conformance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-reports
          path: build/conformance/

      - name: Fail on skipped tests
        run: |
          if grep -E "skipped|\.\.\. skipped" validation.log bindings.log; then
            echo "A skipped test is a conformance gap, not a pass." >&2
            exit 1
          fi
